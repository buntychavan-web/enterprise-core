name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # This project is bootstrapped on the Lovable.dev platform and depends on
      # several @lovable.dev/* packages (vite-tanstack-config, vite-plugin-hmr-gate,
      # vite-plugin-dev-server-bridge) published only to Lovable's private registry
      # at europe-west1-npm.pkg.dev. This step will fail with 403s until the
      # repository is granted an authenticated route to that registry — see
      # docs/DEPLOYMENT.md "Frontend CI prerequisites" for the required secret.
      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile
        env:
          BUN_CONFIG_REGISTRY: ${{ secrets.LOVABLE_NPM_REGISTRY_URL }}
          BUN_CONFIG_TOKEN: ${{ secrets.LOVABLE_NPM_REGISTRY_TOKEN }}

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test:unit -- --run

      - name: Production build
        run: bun run build
        env:
          VITE_ENABLE_DEMO_LOGIN: 'false'

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: .output/
          if-no-files-found: warn

      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile
        env:
          BUN_CONFIG_REGISTRY: ${{ secrets.LOVABLE_NPM_REGISTRY_URL }}
          BUN_CONFIG_TOKEN: ${{ secrets.LOVABLE_NPM_REGISTRY_TOKEN }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
